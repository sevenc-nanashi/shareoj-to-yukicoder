[package]
name = "shareoj-to-yukicoder"
version = "0.1.0"
edition = "2024"

[dependencies]
usage-rs = "7.3.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
pulldown-cmark = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
colored = "3"
console = "0.16"
tempfile = "3"
