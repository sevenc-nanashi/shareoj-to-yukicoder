name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (e.g. 0.2.0)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Update version
        run: |
          git check-ref-format "refs/tags/$TAG"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi
          ruby <<'RUBY'
          require 'json'
          path = 'Cargo.toml'
          manifest = File.read(path)
          abort 'Expected exactly one package version' unless manifest.scan(/^version = .*$/).length == 1
          manifest.sub!(/^version = .*$/) { "version = #{JSON.generate(ENV.fetch('VERSION'))}" }
          File.write(path, manifest)
          RUBY
          cargo update --workspace

      - name: Build
        run: |
          cargo build --release --locked --target "$TARGET"
          mkdir dist
          tar -czf "dist/shareoj_to_yukicoder-$TARGET.tar.gz" \
            -C "target/$TARGET/release" shareoj_to_yukicoder

      - name: Commit and push release
        id: commit
        run: |
          cargo fmt --all --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release v$VERSION"
          git tag "$TAG"
          git push --atomic origin "HEAD:$GITHUB_REF" "refs/tags/$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sign release
        id: packslip
        uses: jdx/packslip@v1
        with:
          artifacts: dist/*.tar.gz
          bin: shareoj_to_yukicoder
          version: ${{ inputs.version }}
          tag: ${{ env.TAG }}
          commit: ${{ steps.commit.outputs.sha }}
          upload: "false"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.packslip.outputs.bundle }}
        run: |
          args=(--verify-tag --generate-notes --title "$TAG")
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" dist/*.tar.gz "$BUNDLE"
